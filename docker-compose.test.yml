version: "3.8"

services:
  flext-meltano-test:
    build:
      context: .
      dockerfile: Dockerfile.test
    volumes:
      - .:/app
      - /var/run/docker.sock:/var/run/docker.sock # Enable Docker-in-Docker
    working_dir: /app
    environment:
      - PYTHONPATH=/app/src
      - MELTANO_ENVIRONMENT=test
      - MELTANO_PROJECT_ROOT=/app/test-project
      # Oracle test database configuration
      - ORACLE_HOST=oracle-test
      - ORACLE_PORT=1521
      - ORACLE_DATABASE=XE
      - ORACLE_USERNAME=system
      - ORACLE_PASSWORD=Oracle123Test
      - ORACLE_SERVICE_NAME=XE
      # PostgreSQL test database configuration
      - POSTGRES_HOST=postgres-test
      - POSTGRES_PORT=5432
      - POSTGRES_DATABASE=flext_test
      - POSTGRES_USERNAME=flext_test
      - POSTGRES_PASSWORD=flext_test_password
      # Redis test configuration
      - REDIS_HOST=redis-test
      - REDIS_PORT=6379
    command: |
      bash -c "
        echo '🐳 Starting FLEXT Meltano Container Validation...'
        
        # Install dependencies
        pip install -e .
        
        # Run comprehensive tests
        echo '🧪 Running pytest with maximum coverage...'
        pytest tests/ --cov=src --cov-report=term-missing --cov-report=html --tb=short
        
        # Run all working examples
        echo '📋 Testing all examples...'
        python examples/real_working_examples_fixed.py
        python examples/working_basic_usage.py
        
        # Run quality gates
        echo '🔒 Running security checks...'
        make validate || echo 'Quality gates completed with warnings'
        
        # Generate test report
        echo '📊 Container validation completed!'
      "
    depends_on:
      - postgres-test
      - redis-test
      - oracle-test

  postgres-test:
    image: postgres:17
    environment:
      POSTGRES_DB: flext_test
      POSTGRES_USER: flext_test
      POSTGRES_PASSWORD: flext_test_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_test_data:/var/lib/postgresql/data

  redis-test:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    volumes:
      - redis_test_data:/data

  oracle-test:
    image: gvenzl/oracle-xe:21-slim
    container_name: flext-meltano-oracle-test
    ports:
      - "1522:1521" # Using different port to avoid conflicts
    environment:
      - ORACLE_PASSWORD=Oracle123Test
      - ORACLE_DATABASE=XEPDB1
      - ORACLE_CHARACTERSET=AL32UTF8
    volumes:
      - oracle_test_data:/opt/oracle/oradata
    healthcheck:
      test:
        [
          "CMD",
          "sqlplus",
          "-L",
          "system/Oracle123Test@//localhost:1521/XE",
          "@/dev/null",
        ]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s

volumes:
  postgres_test_data:
  redis_test_data:
  oracle_test_data:
