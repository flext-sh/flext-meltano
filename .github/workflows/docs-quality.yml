# Documentation Quality CI/CD Pipeline
# Generated by FLEXT-Meltano Documentation Maintenance Framework
# Generated: 2025-10-10 14:54:25

name: Documentation Quality

on:
  push:
    branches: [main, develop]
    paths:
      - "docs/**"
      - "**.md"
      - "scripts/documentation/**"
  pull_request:
    branches: [main, develop]
    paths:
      - "docs/**"
      - "**.md"
      - "scripts/documentation/**"
  schedule:
    # Run weekly audit on monday at 09:00 UTC
    - cron: "0 9 * * 1"

jobs:
  docs-quality-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mkdocs

      - name: Sync workspace docs scripts
        run: |
          if [ -d "flext-meltano" ]; then
            make -C flext-meltano docs
          else
            make docs
          fi

      - name: Run documentation quality audit
        run: |
          if [ -d "flext-meltano" ]; then
            make docs DOCS_PHASE=audit PROJECT=flext-meltano
          else
            make docs DOCS_PHASE=audit
          fi

      - name: Check quality thresholds
        run: |
          if [ -d "flext-meltano" ]; then
            make docs DOCS_PHASE=validate PROJECT=flext-meltano
          else
            make docs DOCS_PHASE=validate
          fi

      - name: Upload quality reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: docs-quality-reports
          path: .reports/docs/

      - name: Comment PR with quality report
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            // Read the quality summary
            const summaryPath = path.join(process.cwd(), '.reports/docs/validate-summary.json');
            if (fs.existsSync(summaryPath)) {
              const summary = JSON.parse(fs.readFileSync(summaryPath, 'utf8'));

              const qualityScore = summary.summary?.result === 'OK' ? 100 : 0;
              const totalIssues = summary.details?.missing_adr_skills?.length || 0;

              const body = `
              ## 📊 Documentation Quality Report

              **Quality Score:** ${qualityScore}/100
              **Total Issues:** ${totalIssues}

              ### Details
              - Scope: ${summary.summary?.scope || 'unknown'}
              - Validation result: ${summary.summary?.result || 'unknown'}
              - Message: ${summary.summary?.message || 'n/a'}

              [View detailed report](https://github.com/${github.repository}/actions/runs/${github.run_id})
              `;

              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: body
              });
            }
