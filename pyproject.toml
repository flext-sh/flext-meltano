[build-system]
    build-backend = "poetry.core.masonry.api"
    requires = [
        "poetry-core>=1.9.0",
    ]

[project]
    classifiers = [
        "Development Status :: 5 - Production/Stable",
        "Intended Audience :: Developers",
        "License :: OSI Approved :: MIT License",
        "Operating System :: OS Independent",
        "Programming Language :: Python :: 3 :: Only",
        "Programming Language :: Python :: 3.13",
        "Topic :: Software Development :: Libraries :: Python Modules",
        "Typing :: Typed",
    ]
    dependencies = [
        "alembic>=1.15.0",
        "dbt-core>=1.10.5",
        "duckdb>=1.0.0",
        "fastapi (>=0.119.0)",
        "httpx>=0.28.0",
        "injectable>=4.0.1",
        "jinja2>=3.1.0",
        "pandas>=2.0.0",
        "prometheus-client (>=0.23.0)",
        "pydantic-settings>=2.10.1",
        "pydantic (>=2.12.3)",
        "python-dotenv>=1.0.0",
        "pyyaml>=6.0.2",
        "requests>=2.31.0",
        "singer-sdk (>=0.52.0)",
        "sqlalchemy>=2.0.0",
        "structlog>=25.1.0",
        "uvicorn (>=0.38.0)",
        "setuptools (>=80.9.0)",
        "pydantic-core (>=2.41.4)",
        "meltano (>=4.0.8,<5.0.0)",
        "wrapt (>=1.17.0,<2.0.0)",
        "referencing (>=0.28.4,<0.37.0)",
    ]

    description = "FLEXT Meltano - Enterprise Data Integration Platform"
    keywords = [
        "data-integration",
        "enterprise",
        "etl",
        "flext",
        "meltano",
        "typed",
    ]
    name = "flext-meltano"
    readme = "README.md"
    requires-python = ">=3.13,<3.14"
    version = "0.9.0"
    [[project.authors]]
        email = "team@flext.sh"
        name  = "FLEXT Team"

    [[project.maintainers]]
        email = "team@flext.sh"
        name  = "FLEXT Team"

    [project.license]
        text = "MIT"

    [project.urls]
        Documentation = "https://github.com/flext-sh/flext/blob/main/README.md"
        Homepage      = "https://github.com/flext-sh/flext"
        Repository    = "https://github.com/flext-sh/flext"

    [project.scripts]
        flext-meltano = "flext_meltano.cli:main"

[tool.bandit]
    exclude_dirs = [
        "build",
        "dist",
        "tests",
    ]
    skips = [
        "B101",
        "B601",
    ]

[tool.poetry]
    name = "flext-meltano"
    version = "0.9.0"
    description = "FLEXT Meltano - Enterprise Data Integration Platform"
    authors = ["FLEXT Team <team@flext.sh>"]

    [[tool.poetry.packages]]
        from    = "src"
        include = "flext_meltano"

    [tool.poetry.dependencies]
        python = ">=3.13,<3.14"
        alembic = "^1.15.0"
        dbt-core = ">=1.10.0"
        duckdb = "^1.0.0"
        fastapi = ">=0.119.0"
        httpx = "^0.28.0"
        injectable = "^4.0.1"
        jinja2 = "^3.1.0"
        pandas = "^2.0.0"
        prometheus-client = ">=0.23.0"
        pydantic-settings = ">=2.11.0"
        pydantic = ">=2.12.3"
        python-dotenv = "^1.0.0"
        pyyaml = "^6.0.2"
        requests = "^2.31.0"
        singer-sdk = ">=0.52.0"
        sqlalchemy = ">=2.0.44"
        structlog = "^25.1.0"
        uvicorn = ">=0.38.0"

[tool.deptry]
    known_first_party = [
        "flext_meltano",
        "flext_core",
        "flext_cli",
        "flext_api",
        "flext_observability",
        "flext_plugin",
    ]
    pep621_dev_dependency_groups = [
        "dev",
        "test",
        "typings",
        "security",
    ]

[tool.deptry.package_module_name_map]
    pyyaml = "yaml"

[tool.deptry.per_rule_ignores]
    DEP002 = [
        # CLI tools (invoked from command line, not imported)
        "autoflake",
        "bandit",
        "black",
        "codespell",
        "commitizen",
        "detect-secrets",
        "isort",
        "pip-audit",
        "pre-commit",
        "pylint",
        "pyrefly",
        "pyupgrade",
        "radon",
        "ruff",
        "vulture",
        # Type stubs
        "numpy",
        "pandas-stubs",
        "scipy-stubs",
        "types-jsonschema",
        "types-openpyxl",
        "types-psutil",
        "types-python-dateutil",
        "types-pyyaml",
        "types-redis",
        "types-requests",
        "types-setuptools",
        "types-toml",
        "types-xlrd",
        # Runtime deps used indirectly (via dbt-core, singer-sdk, meltano)
        "alembic",
        "beartype",
        "dbt-core",
        "duckdb",
        "injectable",
        "meltano",
        "pandas",
        "pydantic-core",
        "pytest-cov",
        "referencing",
        "schedule",
        "setuptools",
        "singer-sdk",
        "wrapt",
    ]

[tool.ruff]
    extend = "../ruff-shared.toml"

[tool.pytest.ini_options]
    addopts = [
        "--maxfail=1",
        "--strict-config",
        "--tb=short",
        "-ra",
    ]
    markers = [
        "concurrency: Concurrency tests",
        "e2e: End-to-end tests",
        "integration: Integration tests",
        "meltano: Meltano-specific tests",
        "performance: Performance tests",
        "real: Real functionality tests without mocks",
        "slow: Slow tests",
        "smoke: Smoke tests",
        "unit: Unit tests",
    ]
    minversion = "8.0"
    testpaths = [
        "tests",
    ]

    [tool.poetry.dependencies.flext-core]
        develop = true
        path    = "../flext-core"

                                                                        [tool.poetry.dependencies.flext-cli]
        develop = true
        path    = "../flext-cli"

                                                                                                                                            [tool.poetry.dependencies.flext-api]
        develop = true
        path    = "../flext-api"

                                                                                                                                                                                                                [tool.poetry.dependencies.flext-observability]
        develop = true
        path    = "../flext-observability"

                                                                                                                                                                                                                                                                                    [tool.poetry.dependencies.flext-plugin]
        develop = true
        path    = "../flext-plugin"

    [tool.ruff.lint.isort]
        known-first-party = [
            "flext_meltano",
        ]

    [tool.poetry.group.dev.dependencies]
        autoflake      = ">=2.3.1"
        black          = ">=25.1.0"
        codespell      = ">=2.3.0"
        commitizen     = ">=4.8.3,<4.9"
        detect-secrets = ">=1.5.0"
        isort          = ">=6.0.1"
        pandas         = "^2.3.1"
        pre-commit     = ">=4.0.1"
        pylint         = ">=3.3.0"
        pyrefly        = "^0.46.3"
        pyupgrade      = ">=3.19.0"
        radon          = ">=6.0.1"
        ruff           = ">=0.12.3"
        schedule       = ">=1.2.0"
        vulture        = ">=2.13"
    beartype = "^0.22.6"
    pytest-cov = "^7.0.0"
    prompt-toolkit = ">=3.0.52"
    sqlparse = ">=0.5.5"

    [tool.poetry.group.test.dependencies]
        
        
factory-boy         = ">=3.3.1"
        faker               = ">=37.4.0"
        hypothesis          = ">=6.125.0"
        pytest              = ">=8.4.0"
        pytest-benchmark    = ">=5.1.0"
        pytest-clarity      = ">=1.0.1"
        pytest-cov = ">=7.0.0"
        pytest-deadfixtures = ">=2.2.1"
        pytest-env          = ">=1.1.5"
        pytest-mock         = ">=3.14.0"
        pytest-sugar        = ">=1.0.0"
        pytest-timeout      = ">=2.4.0"
        pytest-xdist        = ">=3.8.0"
        python-ldap         = ">=3.4.4"

    [tool.poetry.group.typings.dependencies]
        numpy                 = "^2.4.0"
        pandas-stubs          = ">=2.1.4"
        types-psutil          = ">=7.0.0"
        types-python-dateutil = ">=2.9.0"
        types-pyyaml          = ">=6.0.12"
        types-redis           = ">=4.6.0"
        types-requests        = ">=2.32.4"
        types-setuptools      = ">=80.9.0"
        types-toml            = ">=0.10.8.20240310"
    scipy-stubs = "^1.16.2.4"
    types-jsonschema = "^4.25.1.20251009"
    types-openpyxl = "^3.1.5.20250919"
    types-xlrd = "^2.0.0.20251020"

    [tool.poetry.group.security.dependencies]
        bandit    = ">=1.8.0"
        pip-audit = ">=2.7.3"
