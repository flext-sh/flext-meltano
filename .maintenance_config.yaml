# FLEXT-Meltano Documentation Maintenance Configuration
#
# Configuration file for automated documentation quality assurance,
# validation, and maintenance processes.

# Quality Thresholds
quality_thresholds:
  # Content freshness (days)
  max_file_age_days: 90

  # Content volume
  min_words_per_file: 50
  max_words_per_file: 10000

  # Link health
  max_broken_links_ratio: 0.05
  link_validation_timeout: 10
  link_validation_retries: 2

  # Formatting
  max_line_length: 120
  max_heading_depth: 4

  # Structure requirements
  required_sections:
    - "##" # At least one H2 heading
    - "###" # At least one H3 heading

# File Patterns
file_patterns:
  include:
    - "*.md"
    - "*.mdx"
  exclude:
    - "node_modules/**"
    - ".git/**"
    - "**/.*"
    - "**/__pycache__/**"

# Quality Rules
rules:
  # Content structure
  require_table_of_contents: false
  require_frontmatter: false

  # Link validation
  validate_external_links: true
  validate_internal_links: true
  check_image_references: true

  # Style consistency
  enforce_heading_case: "title" # "title", "sentence", or false
  enforce_list_style: "dash" # "dash", "asterisk", or false
  enforce_code_language: true

  # Accessibility
  require_alt_text: true
  require_descriptive_links: false

# Reporting Configuration
reporting:
  output_directory: "docs/reports"
  report_formats:
    - "markdown"
    - "json"
    - "html"
  include_file_details: true
  include_issue_context: true

  # Severity thresholds for notifications
  severity_thresholds:
    critical: 0 # Notify immediately
    high: 5 # Notify if > 5 issues
    medium: 10 # Notify if > 10 issues
    low: 20 # Notify if > 20 issues

# Automation Configuration
automation:
  # CI/CD integration
  enable_ci_checks: true
  fail_on_critical_issues: true
  fail_on_high_issues: false

  # Scheduled maintenance
  enable_scheduled_audits: true
  audit_schedule: "weekly" # "daily", "weekly", "monthly"
  audit_day: "monday" # For weekly audits
  audit_time: "09:00" # UTC time

  # Automated fixes
  enable_autofix: false
  autofix_rules:
    - "line_length"
    - "trailing_whitespace"
    - "heading_case"

# Team Integration
team_integration:
  # Slack/webhook notifications
  enable_notifications: false
  webhook_url: ""

  # Issue tracking integration
  enable_issue_creation: false
  issue_labels:
    - "documentation"
    - "maintenance"

# Custom Rules (extend default behavior)
custom_rules:
  # Project-specific patterns
  flext_patterns:
    - name: "version_consistency"
      pattern: "\\b\\d+\\.\\d+\\.\\d+\\b"
      description: "Version numbers should be consistent across files"

    - name: "flext_imports"
      pattern: "from flext_meltano import"
      description: "Ensure proper FLEXT ecosystem imports"

  # Content quality checks
  content_quality:
    - name: "code_examples"
      min_examples: 1
      description: "Files should contain at least one code example"

    - name: "api_documentation"
      require_signatures: true
      description: "API methods should have signature documentation"

# Performance Optimization
performance:
  max_concurrent_checks: 5
  cache_validation_results: true
  cache_expiry_hours: 24

# Output Customization
output:
  colorize_console: true
  verbose_logging: false
  progress_bars: true

  # Report customization
  report_sections:
    - "overview"
    - "metrics"
    - "issues"
    - "recommendations"
    - "trends"

# Integration Points
integrations:
  github:
    enable_pr_comments: false
    comment_on_failures: true

  gitlab:
    enable_mr_comments: false
    comment_on_failures: true

  # Custom webhook endpoints
  webhooks:
    - url: ""
      events: ["audit_complete", "critical_issues"]
      headers: {}

# Advanced Configuration
advanced:
  # Custom validation scripts
  custom_validators: []

  # Plugin system for extensions
  enable_plugins: false
  plugin_directory: "docs/plugins"

  # Database for historical tracking
  enable_database: false
  database_path: "docs/.maintenance.db"

# Emergency Configuration
emergency:
  # Halt on critical issues
  halt_on_critical: true

  # Emergency contacts
  emergency_contacts: []

  # Fallback procedures
  fallback_mode: "report_only" # "report_only", "fix_automatically", "halt"
